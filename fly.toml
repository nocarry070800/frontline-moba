app = "frontline-moba"
primary_region = "fra"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/api/info"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
