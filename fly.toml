# fly.toml app configuration file generated for frontline-moba on 2026-10-28T22:28:03Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'frontline-moba'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
